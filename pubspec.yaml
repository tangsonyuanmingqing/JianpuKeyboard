name: jianpu_keyboard
description: 数字简谱键盘字母转换器
publish_to: "none"
version: 1.6.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  file_selector: 1.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-1.1.txt
  fonts:
    - family: NotoSansCJKSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-VF.ttf
    - family: NotoSansMonoCJKSC
      fonts:
        - asset: assets/fonts/NotoSansMonoCJKsc-VF.ttf
